[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "intrusion-detection-system"
version = "0.1.0"
description = "CIC-IDS-2017 exploration and real-time network intrusion detection prototype"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "jupyterlab>=4.0",
  "lightgbm>=4.5",
  "matplotlib>=3.8",
  "mlflow>=2.12",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14.0",
  "pytorch-tabnet>=4.1",
  "rtdl-revisiting-models>=0.0.2",
  "scikit-learn>=1.7",
  "seaborn>=0.13",
  "torch>=2.2",
  "watchdog>=4.0",
  "xgboost>=3.0,<3.3"
]

[project.scripts]
ids-run-baselines = "ids_ml.workflows:baseline_main"
ids-run-trees = "ids_ml.workflows:tree_main"
ids-run-neural = "ids_ml.workflows:neural_main"
ids-show-results = "ids_ml.workflows:show_results_main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "tomli>=2.0; python_version < '3.11'"
]

[tool.setuptools.packages.find]
where = ["ml/src"]
include = ["ids_ml*"]
