[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dos-intrusion-detection-system"
version = "0.1.0"
description = "CIC-IDS-2017 exploration and real-time network intrusion detection prototype"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "jupyterlab>=4.0",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "seaborn>=0.13",
  "watchdog>=4.0"
]

[tool.setuptools]
packages = []
