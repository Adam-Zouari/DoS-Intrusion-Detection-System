[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "intrusion-detection-system"
version = "0.1.0"
description = "Multiclass CIC-IDS-2017 research and flow-level intrusion detection application"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "joblib>=1.3",
  "jupyterlab>=4.0",
  "lightgbm>=4.5",
  "matplotlib>=3.8",
  "mlflow>=2.12",
  "numpy>=1.26",
  "optuna>=4.0,<5.0",
  "pandas>=2.1",
  "pyarrow>=14.0",
  "pytorch-tabnet>=4.1",
  "rtdl-revisiting-models>=0.0.2",
  "scikit-learn>=1.7",
  "seaborn>=0.13",
  "torch>=2.2",
  "uvicorn>=0.30,<1.0",
  "xgboost>=3.0,<3.3"
]

[project.scripts]
ids-run-baselines = "ids_ml.screening_workflows:baseline_main"
ids-run-trees = "ids_ml.screening_workflows:tree_main"
ids-run-neural = "ids_ml.screening_workflows:neural_main"
ids-show-results = "ids_ml.screening_workflows:show_results_main"
ids-tune-trees = "ids_ml.tree_tuning.cli:tuning_main"
ids-serve = "ids_backend.app:serve_main"
ids-generate-flows = "ids_tools.replay_flows:generator_main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "tomli>=2.0; python_version < '3.11'"
]

[tool.setuptools.packages.find]
where = ["ml/src", "backend/src", "tools/src"]
include = ["ids_ml*", "ids_backend*", "ids_tools*"]
